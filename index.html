<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kinova</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: a phone-sized app. Fullscreen on phones; framed phone + presenter panel on desktop.
   Palette taken from the Kinova deck: forest, sage, cream, ink, terracotta. */
:root{
  --forest:#2e4e3c; --ink:#1e2b24; --sage:#829c79; --sage-l:#cbd6c4; --pale:#e3e9de; --cream:#e8e2d2; --terra:#b67b58;
  --card:#f3f5ef; --muted:#5b6b60; --line:#cfd8c9;
  --f-ui:'DM Sans',system-ui,sans-serif; --f-serif:'Cormorant Garamond',Georgia,serif; --f-logo:'Jost','DM Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--forest);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:72px}
.panel{display:none;color:var(--cream);max-width:340px}
.panel h2{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:34px;line-height:1.1;margin:22px 0 10px}
.panel p{color:var(--sage-l);line-height:1.5;margin:0 0 20px}
#qr{background:var(--cream);padding:12px;border-radius:12px;display:inline-block;line-height:0}
.panel small{display:block;margin-top:10px;color:var(--sage);font-size:12px}
.phone{width:390px;height:844px;flex:none;position:relative;background:var(--pale);overflow:hidden}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--pale)}
@media (min-width:760px){
  .panel{display:block}
  .phone{border-radius:50px;box-shadow:0 0 0 10px var(--ink),0 0 0 12px #3d5a49,0 30px 80px rgba(0,0,0,.45);transform-origin:center}
  .phone::before{content:"";position:absolute;top:10px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--ink);border-radius:20px;z-index:60}
  .status{display:flex!important}
}
@media (max-width:759px){
  .phone{width:100vw;height:100%}
  .stage{gap:0}
}
.status{display:none;justify-content:space-between;padding:14px 30px 0;font-size:13px;font-weight:600;height:44px;flex:none}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 24px}
/* Logo */
.wm{display:inline-flex;align-items:center;font-family:var(--f-logo);font-weight:300;letter-spacing:.08em;color:var(--cream)}
.wm svg{margin:0 -.02em}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.h1{font-size:28px;font-weight:700;line-height:1.1}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:500}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.muted{color:var(--muted)}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;background:var(--forest);color:var(--cream);font-weight:600;font-size:16px}
.btn.terra{background:var(--terra);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--forest);color:var(--forest)}
.btn.cream{background:var(--cream);color:var(--forest)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.link{color:var(--forest);font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* Welcome / splash */
.dark{background:var(--forest);color:var(--cream)}
.welcome{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:60px 24px 30px;text-align:center}
.welcome .tag{font-family:var(--f-serif);font-style:italic;font-size:20px;color:var(--sage-l);margin-top:14px}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.pulse,.fade{animation:none}}
/* Onboarding */
.dots{display:flex;gap:6px;margin:6px 0 22px}
.dots i{height:4px;flex:1;border-radius:3px;background:var(--sage-l)}
.dots i.on{background:var(--forest)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;width:100%}
.seg{display:flex;background:var(--sage-l);border-radius:12px;padding:3px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--forest);color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:14px}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.chip.s{padding:4px 10px;font-size:12px;background:var(--sage-l);border:0;color:var(--forest)}
.chip.s.sh{background:var(--forest);color:var(--cream)}
.spot{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;margin-bottom:8px}
.spot.on{border-color:var(--forest);background:#eef2ea}
.spot .ph{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none}
.spot .ph svg{width:100%;height:100%;display:block}
.spot b{display:block}
.spot span{font-size:13px;color:var(--muted)}
.tick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.on .tick{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.tick svg{width:14px;height:14px;stroke-width:3}
/* Header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px}
.top .wmd{display:flex;align-items:center;gap:8px;font-family:var(--f-logo);font-weight:400;letter-spacing:.14em;color:var(--forest);font-size:18px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
/* Tabbar */
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 10px;flex:none}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
.tabbar button.on{color:var(--forest)}
.tabbar button.on svg{stroke-width:2.4}
.tabbar .guide{color:#fff}
.tabbar .guide span.o{width:46px;height:46px;border-radius:50%;background:var(--forest);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--card);color:var(--cream)}
.tabbar .guide.on span.o{background:var(--terra)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--terra);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
/* Discover */
.deck{position:relative;height:540px;margin:4px 16px 0}
.pcard{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--forest);color:#fff;box-shadow:0 10px 30px rgba(30,43,36,.25);touch-action:pan-y;user-select:none;cursor:grab}
.pcard.back{transform:scale(.94) translateY(14px);filter:brightness(.85);pointer-events:none}
.pcard .scene{position:absolute;inset:0}
.pcard .scene svg{width:100%;height:100%;display:block}
.pcard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(20,32,26,.92) 78%)}
.pcard .info{position:absolute;left:0;right:0;bottom:0;padding:18px}
.pcard .nm{font-size:27px;font-weight:700}
.pcard .nm span{font-weight:400}
.pcard .sub{font-size:13.5px;opacity:.9;margin:2px 0 8px}
.match{position:absolute;top:14px;left:14px;background:var(--cream);color:var(--forest);font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;display:flex;gap:5px;align-items:center}
.infob{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(30,43,36,.55);color:#fff;display:grid;place-items:center}
.stats{display:flex;gap:0;margin:10px 0 8px;background:rgba(232,226,210,.14);border-radius:12px;padding:8px 4px}
.stats div{flex:1;text-align:center}
.stats b{display:block;font-size:16px}
.stats span{font-size:10.5px;opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.stamp{position:absolute;top:60px;font-size:28px;font-weight:800;letter-spacing:.08em;padding:4px 12px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg)}
.stamp.l{left:20px;color:#9ee0a0;border-color:#9ee0a0}
.stamp.p{right:20px;color:#f2a58a;border-color:#f2a58a;transform:rotate(12deg)}
.acts{display:flex;justify-content:center;gap:22px;padding:18px 0 6px}
.acts button{width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(30,43,36,.15);color:var(--muted)}
.acts button.go{background:var(--terra);color:#fff;width:68px;height:68px;margin-top:-4px}
.acts svg{width:26px;height:26px}
.daily{display:flex;justify-content:space-between;align-items:center;padding:0 20px 6px;font-size:13px;color:var(--muted)}
.meter{display:flex;gap:4px}
.meter i{width:22px;height:5px;border-radius:3px;background:var(--sage-l)}
.meter i.on{background:var(--forest)}
.done{margin:20px;padding:30px 22px;text-align:center;border-radius:24px;background:var(--forest);color:var(--cream)}
.done h2{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:34px;line-height:1.05;margin:14px 0 8px}
.done p{color:var(--sage-l);margin:0 0 18px;line-height:1.45}
/* Sheets */
.scrim{position:absolute;inset:0;background:rgba(20,32,26,.55);z-index:40;animation:fadei .2s}
@keyframes fadei{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--pale);border-radius:26px 26px 0 0;z-index:41;overflow-y:auto;animation:up .28s ease;scrollbar-width:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--sage-l);margin:10px auto 4px}
.sheet .in{padding:8px 22px 28px}
.full{position:absolute;inset:0;z-index:30;background:var(--pale);display:flex;flex-direction:column;animation:fade .25s}
.modal{position:absolute;inset:0;z-index:50;background:var(--forest);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;animation:fadei .25s}
.modal h2{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:46px;margin:18px 0 6px}
.pair{display:flex;margin:18px 0}
.pair .av{margin:0 -10px;border:4px solid var(--forest)}
.av{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:none;display:block;background:var(--sage)}
.av svg{width:100%;height:100%;display:block}
.av.s{width:44px;height:44px}
.av.m{width:58px;height:58px}
/* Lists */
.row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);margin-bottom:8px;width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row b{display:block}
.row .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--terra);flex:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
.sec h3{font-size:18px}
.hcard{border-radius:20px;background:var(--card);margin-bottom:14px;overflow:hidden;width:100%;text-align:left;display:block}
.hcard .cv{height:112px;position:relative}
.hcard .cv svg{width:100%;height:100%;display:block}
.date{position:absolute;top:10px;left:10px;background:var(--cream);color:var(--forest);border-radius:12px;padding:5px 11px;text-align:center;line-height:1.05}
.date b{display:block;font-size:20px}
.date span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.pill{position:absolute;top:10px;right:10px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px}
.pill.g{background:var(--forest)}
.hcard .bd{padding:12px 14px 14px}
.hcard h4{margin:0 0 4px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:14px;height:14px}
.facepile{display:flex;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.facepile .av{width:26px;height:26px;margin-right:-8px;border:2px solid var(--card)}
.facepile em{margin-left:16px;font-style:normal}
.banner{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--forest);color:var(--cream);margin-bottom:16px}
.banner b{display:block}
.banner span{font-size:13px;color:var(--sage-l)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--sage);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--terra)}
.sw.on::after{left:21px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--card);color:var(--muted)}
.tabs button.on{background:var(--forest);color:var(--cream)}
.leader{display:flex;gap:10px;align-items:center;padding:12px;background:#e9efe4;border-radius:14px;margin:14px 0;font-size:14px}
.leader svg{color:var(--forest)}
/* Chat */
.chead{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.chead .t{flex:1;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.msg{max-width:78%;padding:10px 14px;border-radius:18px;line-height:1.35;font-size:15px;animation:fade .2s}
.msg.them{background:var(--card);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--forest);color:var(--cream);align-self:flex-end;border-bottom-right-radius:5px}
.msg.card{padding:0;overflow:hidden;width:78%}
.quick{display:flex;gap:8px;overflow-x:auto;padding:6px 16px;scrollbar-width:none;flex:none}
.quick button{white-space:nowrap;padding:8px 13px;border-radius:99px;background:#fff;border:1.5px solid var(--forest);color:var(--forest);font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center}
.quick button.pl{border-color:var(--terra);color:var(--terra)}
.quick svg{width:15px;height:15px}
.compose{display:flex;gap:8px;padding:8px 14px 14px;flex:none}
.compose input{flex:1;padding:12px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;min-width:0}
.compose button{width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--cream);display:grid;place-items:center;flex:none}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sage);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-3px)}}
.tcard{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line);margin-top:8px}
.tcard h4{margin:0 0 6px;font-size:16px}
.tcard .acts2{display:flex;gap:8px;margin-top:10px}
.lockcard{background:#f6ece4;border:1.5px dashed var(--terra);border-radius:16px;padding:14px;margin-top:8px}
.tl{margin:8px 0 0;padding:0;list-style:none}
.tl li{display:flex;gap:10px;padding:5px 0;font-size:14px}
.tl b{width:48px;flex:none;color:var(--forest)}
/* Profile */
.phero{background:var(--forest);color:var(--cream);padding:6px 20px 26px;text-align:center;border-radius:0 0 28px 28px}
.phero .av{width:92px;height:92px;margin:6px auto 10px;border:4px solid var(--cream)}
.plus{border-radius:20px;padding:18px;background:linear-gradient(135deg,#b67b58,#8e5a3d);color:#fff;margin-bottom:14px}
.plus h3{font-size:20px;display:flex;align-items:center;gap:8px}
.plus p{margin:4px 0 14px;opacity:.92;font-size:14px}
.plus.on{background:linear-gradient(135deg,#2e4e3c,#3e6650)}
.box{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}
.big3{display:flex;margin-top:8px}
.big3 div{flex:1}
.big3 b{font-size:22px;display:block}
.big3 span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.perks{list-style:none;padding:0;margin:14px 0}
.perks li{display:flex;gap:10px;padding:7px 0;font-size:15px;align-items:flex-start}
.perks svg{color:var(--forest);margin-top:1px}
.price{font-size:40px;font-weight:700;letter-spacing:-.02em}
.price small{font-size:16px;font-weight:500;color:var(--muted)}
.stars{display:flex;gap:6px;margin:8px 0 16px}
.stars button{color:var(--sage-l)}
.stars button.on{color:var(--terra)}
.stars svg{width:36px;height:36px;fill:currentColor}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--ink);color:var(--cream);padding:13px 16px;border-radius:14px;z-index:70;font-size:14px;animation:fade .25s;text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 20px 14px}
</style>

<div class="stage">
  <div class="panel">
    <div id="pl"></div>
    <h2>Swipe less. Hike more.</h2>
    <p>Interactive prototype of Kinova. Scan the code to open it on your phone and try every feature.</p>
    <div id="qr"></div>
    <small>Profiles shown are illustrated placeholders, not real people.</small>
  </div>
  <div class="phone" id="phone"><div class="app" id="app"></div></div>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={
 compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 mountain:'<path d="M3 19l6-10 4 6 2-3 6 7z"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>', heart:'<path d="M12 20S4 14.5 4 9a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 5.5-8 11-8 11z"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 check:'<path d="M5 12l5 5 9-10"/>', back:'<path d="M15 5l-7 7 7 7"/>', send:'<path d="M4 12l16-8-6 16-3-7z"/>',
 pin:'<path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/>',

function scene(pi,seed,person=true){const c=PAL[pi%PAL.length];const r=n=>((Math.sin(seed*9301+n*49297)*233280)%1+1)%1;
 const m=(base,amp,col,k)=>{let d=`M0 ${base}`;for(let x=0;x<=10;x++){d+=` L${x*40} ${base-amp*(.4+.6*r(k+x))}`}return `<path d="${d} L400 600 L0 600Z" fill="${col}"/>`};
 let trees='';for(let i=0;i<9;i++){const x=20+i*44+r(i)*20,y=470+r(i+20)*40,s=.7+r(i+30)*.6;trees+=`<path d="M${x} ${y-50*s} l${14*s} ${50*s} h${-28*s}z M${x} ${y-30*s} l${18*s} ${40*s} h${-36*s}z" fill="${c[4]}"/>`}
 const ppl=person?`<g transform="translate(${130+r(5)*70} 190) scale(1.25)"><circle cx="40" cy="28" r="22" fill="#e8e2d2" opacity=".92"/><path d="M-6 150 C-6 80 14 62 40 62 S86 80 86 150Z" fill="#e8e2d2" opacity=".92"/><rect x="62" y="74" width="22" height="46" rx="8" fill="${c[3]}"/></g>`:'';
 return `<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s${pi}_${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="400" height="600" fill="url(#s${pi}_${seed})"/><circle cx="${90+r(1)*220}" cy="${130+r(2)*60}" r="46" fill="#fff" opacity=".55"/>${m(330,150,c[2],1)}${m(400,130,c[3],14)}${m(520,90,c[4],30)}${trees}${ppl}</svg>`}
function avatar(p,cls=''){return `<span class="av ${cls}"><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${PAL[p.pal][1]}"/><circle cx="50" cy="40" r="19" fill="#e8e2d2"/><path d="M12 100C12 68 30 58 50 58S88 68 88 100Z" fill="#e8e2d2"/><path d="M0 100 L25 78 L45 100Z M40 100 L72 70 L100 100Z" fill="${PAL[p.pal][3]}" opacity=".9"/></svg></span>`}

const KEY='kinova_demo_v1';
const base=()=>({step:'splash',ob:0,name:'',age:'',interest:'all',acts:['Hiking','Mountain biking','Camping'],spots:['Mont Saint-Bruno','Mont Orford'],strava:false,plus:false,tab:'discover',idx:0,liked:[],passed:[],matches:{},unread:{},reg:[],notify:false,filter:'all',guide:null,doneSurvey:[]});
let S=base();
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(base(),JSON.parse(r));if(S.step==='splash')S.step='welcome'}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let U={sheet:null,chat:null,toast:null,match:null,survey:null,busy:false};
const me=()=>({n:S.name||'You'});
function compat(p){const a=p.acts.filter(x=>S.acts.includes(x)).length,s=p.spots.filter(x=>S.spots.includes(x)).length;return Math.min(98,62+a*7+s*9)}
const shared=p=>({acts:p.acts.filter(x=>S.acts.includes(x)),spots:p.spots.filter(x=>S.spots.includes(x))});
function queue(){let l=PEOPLE.filter(p=>S.interest==='all'||p.g===S.interest);l=l.sort((a,b)=>(b.likes-a.likes)||(compat(b)-compat(a))).slice(0,6);return l}
function toast(t){U.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{U.toast=null;render()},2200)}

<div class="fade"><div style="display:flex;justify-content:center;gap:8px;margin-bottom:18px;color:var(--sage-l);font-size:13px"><span>Match outdoors</span>·<span>Meet outdoors</span></div>
<button class="btn cream" data-a="start">Get started</button><button class="btn" style="background:transparent;color:var(--sage-l);margin-top:6px;font-size:14px" data-a="skip">Skip setup, explore the demo</button></div></div>`}
function vOnb(){const st=S.ob;let body='',ok=true,title='',sub='';
 if(st===0){title='Let\'s build your trail profile';sub='Just the basics.';ok=S.name.trim().length>0;
  body=`<div class="field"><label for="nm">First name</label><input id="nm" value="${esc(S.name)}" placeholder="Your first name" autocomplete="off"></div>

 if(st===1){title='What do you love doing outside?';sub='Pick as many as you like. Matches start here.';ok=S.acts.length>0;
  body=`<div class="chips">${ACTS.map(a=>`<button class="chip ${S.acts.includes(a)?'on':''}" data-a="act" data-v="${a}">${a}</button>`).join('')}</div>`}
 if(st===2){title='Your favourite hiking spots';sub='All under two hours from Montréal.';ok=S.spots.length>0;

 if(st===3){title='Let your trails do the talking';sub='Connect Strava so your profile shows real hikes, not just photos.';

 return `<div class="pad fade" style="padding-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">${st>0?`<button class="iconbtn" data-a="obback">${ic('back')}</button>`:'<span></span>'}<span class="eyebrow">Step ${st+1} of 4</span></div><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>

function hdr(){return `<div class="top"><div class="wmd">${heart(26)}<span>KINOVA</span></div><button class="iconbtn" data-a="sheet" data-v="plus" aria-label="Kinova Plus" style="color:${S.plus?'var(--terra)':'var(--forest)'}">${ic('bolt')}</button></div>`}

function card(p,back){const sh=shared(p);return `<div class="pcard ${back?'back':''}" ${back?'':'id="top"'} data-id="${p.id}">

 <div class="chips" style="gap:6px">${p.spots.slice(0,2).map(x=>`<span class="chip s ${sh.spots.includes(x)?'sh':''}">${ic('pin').replace('class="i"','class="i" style="width:12px;height:12px;margin-right:3px;vertical-align:-1px"')}${x}</span>`).join('')}${sh.acts.slice(0,1).map(x=>`<span class="chip s sh">${x}</span>`).join('')}</div></div></div>`}

function vDiscover(){const q=queue();const left=q.slice(S.idx);
 const bar=`<div class="daily"><span>Today's picks · ${Math.min(S.idx+1,q.length)} of ${q.length}</span><div class="meter">${q.map((_,i)=>`<i class="${i<S.idx?'on':''}"></i>`).join('')}</div></div>`;
 if(!left.length)return hdr()+`<div class="done fade">${heart(70)}<h2>That's it for today.<br>Now go hike.</h2><p>Kinova gives you a few well-matched people a day instead of endless swiping. Meet them outdoors.</p><button class="btn cream" data-a="tab" data-v="hikes">See group hikes</button><button class="btn" style="background:transparent;color:var(--sage-l);margin-top:6px" data-a="replay">Replay today's picks</button></div>`;
 return hdr()+bar+`<div class="deck">${left[1]?card(left[1],true):''}${card(left[0])}</div>

 if(/sunrise|early|dawn/.test(t))return {t:'For sunrise, Mont Saint-Hilaire faces east and the summit is reached in about 90 minutes. Bring a headlamp.',h:trailCard(spotBy('Mont Saint-Hilaire'))};

function setTab(t){S.tab=t;U.chat=null;U.sheet=null;render()}
function like(id,viaCard){const p=PEOPLE.find(x=>x.id===id);S.liked.push(id);S.idx=Math.min(S.idx+ (viaCard?1:0),queue().length);
 if(!viaCard){const q=queue();const i=q.findIndex(x=>x.id===id);if(i===S.idx)S.idx++}
 if(p.likes&&!S.matches[id]){S.matches[id]=[{t:`Hey ${S.name||''}! I saw we both love ${shared(p).spots[0]||p.spots[0]}. Have you been recently?`,me:0}];S.unread[id]=1;U.match=id;U.sheet=null}render()}
function pass(id){S.passed.push(id);const q=queue();const i=q.findIndex(x=>x.id===id);if(i===S.idx)S.idx++;U.sheet=null;render()}
function fling(dir,cb){const c=$('#top');if(!c){cb();return}c.style.transition='transform .28s ease-out,opacity .28s';c.style.transform=`translateX(${dir*500}px) rotate(${dir*25}deg)`;c.style.opacity='0';setTimeout(cb,260)}
function bindDrag(){const c=$('#top');if(!c)return;let sx=0,dx=0,on=false;const L=c.querySelector('.stamp.l'),Pp=c.querySelector('.stamp.p');
 c.onpointerdown=e=>{if(e.target.closest('button'))return;on=true;sx=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 c.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;L.style.opacity=Math.max(0,dx/100);Pp.style.opacity=Math.max(0,-dx/100)};
 c.onpointerup=c.onpointercancel=e=>{if(!on)return;on=false;if(Math.abs(dx)>90){const id=c.dataset.id;fling(dx>0?1:-1,()=>dx>0?like(id,1):pass(id))}else{c.style.transition='transform .2s';c.style.transform='';L.style.opacity=Pp.style.opacity=0}}}

 const T=txt.toLowerCase();let r;
 if(/group|hike\b.*launch|invite/.test(T)&&txt!==''&&txt.startsWith('hikeCard'))r='Love that. A group hike takes the pressure off. Count me in!';
 else if(/weekend|saturday|sunday|this/.test(T))r=`Saturday morning works for me! Want to start with the group hike so it's relaxed?`;

 setTimeout(()=>{const ty=$('#ty');if(ty)ty.remove();if(S.matches[id]){addMsg(id,{t:r,me:0})}},1300)}

document.addEventListener('input',e=>{if(e.target.id==='nm')S.name=e.target.value;if(e.target.id==='ag')S.age=e.target.value.replace(/\D/g,'');
 const b=$('[data-a=obnext]');if(b&&S.step==='onb'&&S.ob===0)b.disabled=!S.name.trim()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='FORM')return;const a=el.dataset.a,v=el.dataset.v;
 switch(a){
  case'start':S.step='onb';S.ob=0;render();break;
  case'skip':Object.assign(S,{step:'app',name:S.name||'Alex',age:S.age||'30',strava:true});S.tab='discover';render();break;
  case'int':S.interest=v;render(1);break;
  case'act':S.acts=S.acts.includes(v)?S.acts.filter(x=>x!==v):[...S.acts,v];render(1);break;
  case'spot':S.spots=S.spots.includes(v)?S.spots.filter(x=>x!==v):[...S.spots,v];render(1);break;
  case'obnext':if(S.ob<3){S.ob++;render()}else{S.step='app';S.tab='discover';S.idx=0;render()}break;
  case'obback':S.ob--;render();break;
  case'strava':if(U.busy)break;U.busy=true;render(1);setTimeout(()=>{U.busy=false;S.strava=true;render(1);toast('Strava connected')},1100);break;
  case'tab':setTab(v);break;
  case'like':{const c=$('#top');if(c)fling(1,()=>like(c.dataset.id,1));break}
  case'pass':{const c=$('#top');if(c)fling(-1,()=>pass(c.dataset.id));break}
  case'like2':U.sheet=null;like(v,0);break;
  case'pass2':pass(v);break;
  case'replay':S.idx=0;S.liked=[];render();break;
  case'profile':U.sheet='prof:'+v;render();break;
  case'sheet':U.sheet=v;render(1);break;
  case'close':U.sheet=null;render(1);break;
  case'filter':S.filter=v;render();break;
  case'notify':S.notify=!S.notify;render(1);toast(S.notify?'We\'ll notify you when July hikes go out':'Notifications off');break;
  case'hike':U.sheet='hike:'+v;render(1);break;
  case'reg':if(!S.reg.includes(v))S.reg.push(v);render(1);toast('You\'re in. Reminder set.');break;
  case'unreg':S.reg=S.reg.filter(x=>x!==v);U.sheet=null;render(1);break;
  case'survey':U.survey={r:0,m:null};U.sheet='survey:'+v;render(1);break;
  case'star':U.survey.r=+v;render(1);break;
  case'met':U.survey.m=v;render(1);break;
  case'sendsurvey':U.sheet=null;render(1);toast('Thanks! Your feedback helps us plan better hikes.');break;
  case'plus':S.plus=true;U.sheet=null;render(1);toast('Kinova Plus is on. First month free.');break;
  case'plusoff':S.plus=false;U.sheet=null;render(1);break;
  case'copy':try{navigator.clipboard.writeText($('#lk').textContent).then(()=>toast('Link copied'),()=>toast('Press and hold the link to copy'))}catch(x){toast('Press and hold the link to copy')};break;
  case'strshare':U.sheet=null;toast('Shared to Strava');break;
  case'reset':try{localStorage.removeItem(KEY)}catch(x){};S=base();S.step='welcome';U={sheet:null,chat:null,toast:null,match:null,survey:null,busy:false};render();break;
  case'chat':if(!S.matches[v])break;U.chat=v;U.sheet=null;U.match=null;S.tab='matches';S.unread[v]=0;render();break;
  case'chatback':U.chat=null;render();break;
  case'closematch':U.match=null;render();break;
  case'matchguide':{const id=v;U.match=null;U.chat=null;S.tab='guide';S.guide={ctx:id,m:[]};render();break}
  case'q':{const id=U.chat;
   if(v==='hike')sendChat('Want to hike together this weekend?');
   if(v==='group'){addMsg(id,{t:'',me:1,hike:'h1'});addMsg(id,{t:'Want to join this group hike with me?',me:1});reply(id,'group')}
   if(v==='guide'){S.guide={ctx:id,m:[]};U.chat=null;S.tab='guide';render()}
   if(v==='date'){if(!S.plus){U.sheet='plus';render(1)}else{S.guide={ctx:id,m:[]};U.chat=null;S.tab='guide';render();guideAsk('Plan the hike date',id)}}
   break}
  case'gq':{const ctx=S.guide&&S.guide.ctx;guideAsk(v,ctx||undefined);break}
  case'sendplan':{const id=S.guide.ctx;if(id&&S.matches[id]){addMsg(id,{t:'Trail Guide made us a plan for Saturday. Interested?',me:1});toast('Plan sent')}break}
 }});

/* ---------- boot ---------- */
function fit(){const p=$('#phone');if(window.innerWidth<760){p.style.transform='';return}const s=Math.min(1,(window.innerHeight-48)/844);p.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
$('#pl').innerHTML=wordmark(34);
try{new QRCode($('#qr'),{text:'https://claude.ai/artifact/9j2HbS9h3P32NBv5yXxBWQ',width:150,height:150,colorDark:'#1e2b24',colorLight:'#e8e2d2'})}catch(e){$('#qr').parentNode.style.display='none'}
render();
if(S.step==='splash')setTimeout(()=>{if(S.step==='splash'){S.step='welcome';render()}},1700);
</script>

</body></html>
